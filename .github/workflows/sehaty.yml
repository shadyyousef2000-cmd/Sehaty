name: Sehaty build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions: { contents: read, pages: write, id-token: write }
jobs:
  pages:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    concurrency: { group: pages-sehaty, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q sehaty.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: sehaty/www }
      - id: d
        uses: actions/deploy-pages@v4
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q sehaty.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: sehaty
        run: |
          npm install
          npx cap add android
          npx cap sync android
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $f
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sehaty-apk
          path: sehaty/android/app/build/outputs/apk/debug/app-debug.apk
